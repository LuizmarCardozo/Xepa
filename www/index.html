<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width,
                   initial-scale=1.0,
                   maximum-scale=1.0,
                   user-scalable=no"
    />

    <meta name="theme-color" content="#08400B" />

    <title>Ofertas - Home</title>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body>
    <div class="app">
      <!-- ================= HEADER ================= -->

      <header class="header">
        <div class="logo">
          <img src="assets/XEPPPA.png" alt="Xepa logo" class="logo-img" />
        </div>

        <div class="search-area">
          <div class="search-box">
            <span class="search-icon">⌕</span>

            <input
              type="text"
              id="searchInput"
              placeholder="Pesquisar ofertas..."
              autocomplete="off"
            />
          </div>

          <button class="menu-button" id="menuButton" aria-label="Abrir menu">
            <span></span>
            <span></span>
            <span></span>
          </button>
        </div>
      </header>

      <!-- ================= CONTEÚDO ================= -->

      <main class="main-content">
        <div class="section-header">
          <h1>FEED DE OFERTAS</h1>

          <span id="offerCount"></span>
        </div>

        <!-- OFERTAS -->

        <section class="offers-list" id="offersList">
          <!--
                    As ofertas serão carregadas
                    automaticamente pelo JavaScript.
                -->
        </section>

        <!-- Mensagem quando não encontrar oferta -->

        <div class="empty-message" id="emptyMessage">
          <div class="empty-icon">⌕</div>

          <h2>Nenhuma oferta encontrada</h2>

          <p>Tente pesquisar por outro produto.</p>
        </div>
      </main>

      <!-- ================= MENU INFERIOR ================= -->

      <nav class="bottom-nav">
        <!-- ADICIONAR -->

        <button
          class="nav-button add-button"
          id="addButton"
          aria-label="Adicionar oferta"
        >
          <span>+</span>
        </button>

        <!-- HOME -->

        <button class="nav-button home-button active" id="homeButton">
          <span class="nav-icon home-icon"> ⌂ </span>

          <span class="nav-label"> HOME </span>
        </button>

        <!-- PERFIL -->

        <button class="nav-button profile-button" id="profileButton">
          <span class="nav-icon profile-icon"> ● </span>

          <span class="nav-label"> PERFIL </span>
        </button>
      </nav>
    </div>

    <!-- ================= MODAL DO MENU ================= -->

    <div class="menu-overlay" id="menuOverlay">
      <div class="side-menu">
        <button class="close-menu" id="closeMenu">×</button>

        <h2>Menu</h2>

        <button class="menu-item">Categorias</button>

        <button class="menu-item">Minhas ofertas</button>

        <button class="menu-item">Favoritos</button>

        <button class="menu-item">Configurações</button>
      </div>
    </div>

    <!-- ================= MODAL ADICIONAR ================= -->

    <div class="modal-overlay" id="addModal">
      <div class="modal">
        <button class="modal-close" id="closeAddModal">×</button>

        <h2>Nova oferta</h2>

        <p>
          Aqui futuramente ficará o formulário para cadastrar uma nova oferta.
        </p>

        <button class="modal-confirm" id="modalOk">Entendi</button>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
