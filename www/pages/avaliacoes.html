<main class="seller-reviews-page">
  <header class="seller-reviews-header">
    <button
      class="seller-reviews-back"
      type="button"
      onclick="Router.back('home')"
      aria-label="Voltar"
    >
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="m15 18-6-6 6-6" />
      </svg>
    </button>
    <h1>Avaliações</h1>
  </header>

  <section class="seller-reviews-summary" aria-label="Resumo das avaliações">
    <div class="seller-reviews-average">
      <strong data-reviews-average>—</strong>
      <span>de 5</span>
      <span class="seller-review-stars" data-reviews-average-stars aria-label="Sem avaliações">
        <span class="seller-review-stars-filled">★★★★★</span>
        <span class="seller-review-stars-empty">☆☆☆☆☆</span>
      </span>
      <span class="seller-reviews-total" data-reviews-total>0 avaliações</span>
    </div>
    <div class="seller-reviews-distribution" data-reviews-distribution aria-label="Distribuição das notas">
      <div class="seller-reviews-distribution-row" data-rating-row="5"><span>5 ★</span><span class="seller-reviews-bar"><span></span></span></div>
      <div class="seller-reviews-distribution-row" data-rating-row="4"><span>4 ★</span><span class="seller-reviews-bar"><span></span></span></div>
      <div class="seller-reviews-distribution-row" data-rating-row="3"><span>3 ★</span><span class="seller-reviews-bar"><span></span></span></div>
      <div class="seller-reviews-distribution-row" data-rating-row="2"><span>2 ★</span><span class="seller-reviews-bar"><span></span></span></div>
      <div class="seller-reviews-distribution-row" data-rating-row="1"><span>1 ★</span><span class="seller-reviews-bar"><span></span></span></div>
    </div>
  </section>

  <div class="seller-reviews-filters" role="group" aria-label="Filtrar avaliações">
    <button class="seller-review-filter is-active" type="button" data-review-filter="all" aria-pressed="true">Todos</button>
    <button class="seller-review-filter" type="button" data-review-filter="recent" aria-pressed="false">Recentes</button>
    <button class="seller-review-filter" type="button" data-review-filter="photos" aria-pressed="false">Com fotos</button>
    <label class="seller-review-rating-filter">
      <span class="visually-hidden">Filtrar por nota</span>
      <select data-review-rating-filter aria-label="Filtrar por nota">
        <option value="all">Estrelas</option>
        <option value="5">5 estrelas</option>
        <option value="4">4 estrelas</option>
        <option value="3">3 estrelas</option>
        <option value="2">2 estrelas</option>
        <option value="1">1 estrela</option>
      </select>
    </label>
  </div>

  <section class="seller-reviews-list" data-review-list aria-live="polite">
    <p class="seller-reviews-message">Carregando avaliações...</p>
  </section>
</main>
