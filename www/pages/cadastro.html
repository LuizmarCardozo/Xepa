<main class="auth-page">
  <img class="logo-image" src="assets/XEPPPA.png" alt="Xepa" />
  <h1 class="page-title">Criar conta</h1>
  <p class="subtitle" style="margin-bottom: 20px">
    Escolha como você vai usar o Xepa.
  </p>

  <div class="account-type">
    <button class="account-option selected" data-type="cliente">
      🛒<br /><b>Cliente</b>
    </button>
    <button class="account-option" data-type="comerciante">
      🏪<br /><b>Comerciante</b>
    </button>
  </div>

  <form id="cad-form">
    <div class="form-group">
      <label class="form-label">Nome</label>
      <input id="name" class="form-input" required placeholder="Seu nome" />
    </div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input
        id="email"
        class="form-input"
        type="email"
        required
        placeholder="voce@email.com"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input
        id="password"
        class="form-input"
        type="password"
        required
        placeholder="Crie uma senha"
      />
    </div>
    <button class="btn btn-primary btn-full">Criar conta</button>
  </form>

  <div class="auth-footer">
    Já possui conta? <button onclick="Router.go('login')">Entrar</button>
  </div>
</main>
