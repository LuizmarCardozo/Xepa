<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xepa - Login</title>
    <link rel="stylesheet" href="auth.css" />
  </head>
  <body>
    <main class="app-container">
      <!-- Topo (A cesta e curva estão na imagem de fundo via CSS) -->
      <header class="header-section">
        <img src="assets/XEPPPA.png" alt="Logo Xepa" class="logo-img" />
        <p>Tudo o que você precisa,<br /><strong>pertinho de você.</strong></p>
      </header>

      <!-- Card Branco Flutuante (borda em todos os lados e sem scroll) -->
      <div class="auth-card">
        <h2>
          Bem-vindo de volta!
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#219653"
            stroke-width="3"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2v4"></path>
            <path d="M5.5 5.5l2.5 2.5"></path>
            <path d="M18.5 5.5l-2.5 2.5"></path>
          </svg>
        </h2>
        <p class="subtitle">Entre na sua conta para continuar</p>

        <form id="login-form" action="#" method="POST" novalidate>
          <!-- Input Email -->
          <div class="input-group">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"
              ></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input
              type="email"
              id="email"
              autocomplete="email"
              placeholder="E-mail cadastrado"
              required
            />
          </div>

          <!-- Input Senha -->
          <div class="input-group">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" placeholder="Senha" required />
          </div>

          <p
            id="login-feedback"
            class="auth-feedback"
            role="status"
            aria-live="polite"
            hidden
          ></p>

          <a href="#" class="forgot-password">Esqueci minha senha</a>

          <!-- Botão Entrar -->
          <button type="submit" class="btn-primary auth-btn-primary">
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
              <polyline points="10 17 15 12 10 7"></polyline>
              <line x1="15" y1="12" x2="3" y2="12"></line>
            </svg>
            Entrar
          </button>

          <div class="divider">ou</div>

          <!-- Botão Google -->
          <button type="button" id="btn-google" class="btn-google">
            <svg width="18" height="18" viewBox="0 0 48 48">
              <path
                fill="#EA4335"
                d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"
              ></path>
              <path
                fill="#4285F4"
                d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"
              ></path>
              <path
                fill="#FBBC05"
                d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"
              ></path>
              <path
                fill="#34A853"
                d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"
              ></path>
            </svg>
            Continuar com o google
          </button>

          <p class="switch-auth-link">
            Ainda não tem uma conta?
            <a
              href="#"
              onclick="
                event.preventDefault();
                Router.go('cadastro');
              "
              >criar conta</a
            >
          </p>

          <!-- Barra de Vantagens (Dentro do Card Branco) -->
          <div class="features-bar">
            <div class="feature-item">
              <div class="feat-icon">
                <svg
                  width="10"
                  height="10"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#219653"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"
                  ></path>
                  <circle cx="12" cy="10" r="3"></circle>
                </svg>
              </div>
              <div class="feat-text">
                <strong>Feiras próximas</strong>
                <span>Na sua região</span>
              </div>
            </div>
            <div class="feat-divider"></div>
            <div class="feature-item">
              <div class="feat-icon">
                <svg
                  width="10"
                  height="10"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#219653"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path
                    d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"
                  ></path>
                  <line x1="7" y1="7" x2="7.01" y2="7"></line>
                </svg>
              </div>
              <div class="feat-text">
                <strong>Produtos frescos</strong>
                <span>Direto do produtor</span>
              </div>
            </div>
            <div class="feat-divider"></div>
            <div class="feature-item">
              <div class="feat-icon">
                <svg
                  width="10"
                  height="10"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="#219653"
                  stroke-width="2.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                >
                  <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                  <polyline points="9 12 11 14 15 10"></polyline>
                </svg>
              </div>
              <div class="feat-text">
                <strong>Compra segura</strong>
                <span>Com a comunidade</span>
              </div>
            </div>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
