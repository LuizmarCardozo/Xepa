<main class="auth-page">
  <img class="logo-image" src="assets/XEPPPA.png" alt="Xepa" />
  <h1 class="page-title">Entrar</h1>
  <p class="subtitle" style="margin-bottom: 22px">Acesse sua conta no Xepa.</p>

  <form id="login-form">
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input
        id="email"
        class="form-input"
        type="email"
        required
        placeholder="voce@email.com"
      />
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input
        id="password"
        class="form-input"
        type="password"
        required
        placeholder="••••••••"
      />
    </div>
    <button class="btn btn-primary btn-full">Entrar</button>
  </form>

  <div class="auth-footer">
    Ainda não tem conta?
    <button onclick="Router.go('cadastro')">Criar conta</button>
  </div>
</main>
