<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xepa - Home</title>
    <link rel="stylesheet" href="../css/global.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/home.css" />
  </head>
  <body>
    <div id="app">
      <main class="page">
        <section class="merchant-dashboard" aria-label="Painel da banca">
          <img
            class="merchant-dashboard-banner"
            src="assets/comercial.png"
            alt="Seus produtos, mais perto dos clientes. Gerencie seu estoque e mantenha sua loja sempre ativa."
          />

          <div class="merchant-dashboard-cards">
            <button
              class="merchant-summary-card merchant-summary-orders"
              type="button"
              onclick="Router.go('pedidos')"
              aria-label="Pedidos recebidos hoje"
            >
              <span class="merchant-summary-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48">
                  <path d="M7 9h5l4.2 21.2a4 4 0 0 0 3.9 3.2h15.2a4 4 0 0 0 3.8-2.8L44 17H14" />
                  <circle cx="21" cy="39" r="3.5" />
                  <circle cx="35" cy="39" r="3.5" />
                </svg>
              </span>
              <span class="merchant-summary-copy">
                <span class="merchant-summary-title">Pedidos de hoje</span>
                <strong class="merchant-summary-value" data-merchant-metric="today-orders">—</strong>
                <span class="merchant-summary-trend" data-merchant-metric="orders-change">Carregando...</span>
                <span class="merchant-summary-note" data-merchant-metric="orders-comparison">Aguardando dados</span>
              </span>
              <svg class="merchant-summary-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 5 7 7-7 7" />
              </svg>
            </button>

            <button
              class="merchant-summary-card merchant-summary-performance"
              type="button"
              onclick="Router.go('minhasOfertas')"
              aria-label="Vendas concluídas neste mês"
            >
              <span class="merchant-summary-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48">
                  <rect x="7" y="27" width="8" height="15" rx="3" />
                  <rect x="19" y="20" width="8" height="22" rx="3" />
                  <rect x="31" y="12" width="8" height="30" rx="3" />
                  <rect x="41" y="5" width="5" height="37" rx="2.5" />
                </svg>
              </span>
              <span class="merchant-summary-copy">
                <span class="merchant-summary-title">Vendas concluídas</span>
                <strong class="merchant-summary-value" data-merchant-metric="monthly-sales">—</strong>
                <span class="merchant-summary-note" data-merchant-metric="sales-period">Neste mês</span>
              </span>
              <svg class="merchant-summary-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 5 7 7-7 7" />
              </svg>
            </button>

            <button
              class="merchant-summary-card merchant-summary-reviews"
              type="button"
              onclick="Router.go('avaliacoes')"
              aria-label="Ver avaliações dos clientes"
            >
              <span class="merchant-summary-icon" aria-hidden="true">
                <svg viewBox="0 0 48 48">
                  <path d="m24 4 6.2 12.6L44 18.7 34 28.5l2.4 13.8L24 35.8l-12.4 6.5L14 28.5 4 18.7l13.8-2.1L24 4Z" />
                </svg>
              </span>
              <span class="merchant-summary-copy">
                <span class="merchant-summary-title">Avaliações</span>
                <strong class="merchant-summary-value">
                  <span data-merchant-metric="review-rating">—</span>
                  <span class="merchant-rating-star" aria-hidden="true">★</span>
                </strong>
                <span class="merchant-summary-note" data-merchant-metric="review-count">Carregando avaliações</span>
              </span>
              <svg class="merchant-summary-chevron" viewBox="0 0 24 24" aria-hidden="true">
                <path d="m9 5 7 7-7 7" />
              </svg>
            </button>
          </div>
        </section>

        <!-- ============ HEADER ============ -->
        <header class="home-header">
          <div class="header-text">
            <h1 id="user-greeting">Olá, usuário 👋</h1>
            <p>O que você procura hoje?</p>
          </div>
          <div class="home-header-actions" data-home-header-actions>
          </div>
        </header>

        <!-- ============ BUSCA ============ -->
        <div class="search-wrapper">
          <div class="search-bar">
            <svg
              class="search-icon"
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="#999"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              placeholder="Buscar produtos, produtores, feiras..."
            />
          </div>
        </div>

        <!-- ============ CATEGORIAS ============ -->
        <section class="section home-categories-section">
          <div class="section-header">
            <h2>Categorias</h2>
            <a href="#" class="link-green">Ver todas</a>
          </div>
          <div class="categories-scroll hide-scrollbar">
            <div class="category-item">
              <div class="category-img-wrap" style="background: #eaf6ea">
                <img
                  src="https://images.unsplash.com/photo-1540420773420-3366772f4999?w=150&q=80"
                  alt="Hortifruti"
                />
              </div>
              <span class="category-label">Hortifruti</span>
            </div>
            <div class="category-item">
              <div class="category-img-wrap" style="background: #fff5e6">
                <img
                  src="https://images.unsplash.com/photo-1628088062854-d1870b4553da?w=150&q=80"
                  alt="Laticíneos"
                />
              </div>
              <span class="category-label">Laticíneos</span>
            </div>
            <div class="category-item">
              <div class="category-img-wrap" style="background: #fcebeb">
                <img
                  src="assets/carnes.jpg"
                  alt="Carnes"
                />
              </div>
              <span class="category-label">Carnes</span>
            </div>
            <div class="category-item">
              <div class="category-img-wrap" style="background: #fdf4e8">
                <img
                  src="https://images.unsplash.com/photo-1509440159596-0249088772ff?w=150&q=80"
                  alt="Padaria"
                />
              </div>
              <span class="category-label">Padaria</span>
            </div>
            <div class="category-item">
              <div class="category-img-wrap" style="background: #fcf1e4">
                <img
                  src="https://images.unsplash.com/photo-1585338107529-13afc5f02586?w=150&q=80"
                  alt="Artesanais"
                />
              </div>
              <span class="category-label">Artesanais</span>
            </div>
          </div>
        </section>

        <!-- ============ BANNER ANUNCIO ============ -->
        <img
          id="home-promo-banner"
          src="assets/anuncio.png"
          alt="Produtos frescos da sua região"
          class="promo-banner"
        />

        <!-- ============ FEIRAS CADASTRADAS ============ -->
        <section class="section home-fairs-section">
          <div class="section-header">
            <h2>Feiras cadastradas</h2>
            <a href="#" class="link-green"
              >Ver todas
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle>
              </svg>
            </a>
          </div>
          <div class="markets-scroll hide-scrollbar" data-fairs>
            <!-- Preenchido via JS -->
          </div>
        </section>

        <!-- ============ NOVIDADES DAS FEIRAS ============ -->
        <section class="section home-markets-section">
          <div class="section-header">
            <h2>Novidades das feiras</h2>
            <a href="#" class="link-green"
              >Ver todas
              <svg
                width="12"
                height="12"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                <circle cx="12" cy="10" r="3"></circle></svg
            ></a>
          </div>
          <div class="markets-scroll hide-scrollbar" data-markets>
            <!-- Preenchido via JS -->
          </div>
        </section>

        <!-- ============ PRODUTOS PERTO DE VOCÊ ============ -->
        <section class="section home-products-section">
          <div class="section-header">
            <h2 id="home-products-title">Ofertas para você</h2>
            <a href="#" class="link-green">Ver todas</a>
          </div>
          <div class="product-grid" data-products-nearby>
            <!-- Preenchido via JS (4 colunas) -->
          </div>
        </section>

        <!-- ============ ÚLTIMAS COMPRAS ============ -->
        <section
          class="section home-recent-section"
          style="padding-bottom: 120px"
        >
          <div class="section-header">
            <h2>Mais ofertas</h2>
            <a href="#" class="link-green">Ver todas</a>
          </div>
          <div class="product-grid" data-products-recent>
            <!-- Preenchido via JS (4 colunas) -->
          </div>
        </section>
      </main>

      <!-- ============ NAV INFERIOR ============ -->
      <nav class="bottom-nav">
        <!-- "Feira" ativo nesta tela -->
        <button class="nav-item active" data-page="home">
          <div class="nav-icon-wrap">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
          </div>
          <span class="nav-label">Feira</span>
        </button>

        <button class="nav-item" data-page="ofertas">
          <div class="nav-icon-wrap">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M12 2l3.09 3.09L19.36 5l-.54 4.27L22 12l-3.18 2.73.54 4.27-4.27-.09L12 22l-3.09-3.09L4.64 19l.54-4.27L2 12l3.18-2.73-.54-4.27 4.27.09L12 2z"
              ></path>
              <path d="M9 15l6-6"></path>
              <circle cx="9" cy="9" r="0.5" fill="currentColor"></circle>
              <circle cx="15" cy="15" r="0.5" fill="currentColor"></circle>
            </svg>
          </div>
          <span class="nav-label">Ofertas</span>
        </button>

        <button class="nav-item" data-page="pedidos">
          <div class="nav-icon-wrap">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"
              ></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>
          <span class="nav-label">Pedidos</span>
        </button>

        <button class="nav-item" data-page="perfil">
          <div class="nav-icon-wrap">
            <svg
              width="22"
              height="22"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
          <span class="nav-label">Perfil</span>
        </button>
      </nav>
    </div>

    <script src="../js/home.js"></script>
  </body>
</html>
