<main class="page merchant-products-page">
  <header class="merchant-products-header">
    <div class="merchant-products-brand">
      <img src="assets/Xepalogo.png" alt="Xepa" />
    </div>
    <svg class="merchant-products-artwork" viewBox="0 0 88 72" aria-hidden="true">
      <path d="M8 24h72l-5-17H13L8 24Z" />
      <path d="M12 24v39h64V24M27 63V43h17v20M55 63V45h13v18" />
      <path d="M8 24c0 8 11 8 11 0 0 8 11 8 11 0 0 8 11 8 11 0 0 8 11 8 11 0 0 8 11 8 11 0 0 8 11 8 11 0" />
      <path d="M26 41c-1-8 9-12 13-5 4-7 14-3 13 5M31 41c1-5 6-7 9-5 3-2 8 0 9 5M37 41v-6m7 6v-8" />
      <path d="M55 39c0-5 5-8 9-5 4-3 9 0 9 5M58 39v-5m6 5v-8m6 8v-5" />
    </svg>
    <div class="merchant-products-title">
      <h1>Produtos</h1>
      <p>Gerencie todos os produtos da sua loja.</p>
    </div>
  </header>

  <button
    class="merchant-add-product"
    type="button"
    onclick="Router.go('criarOferta')"
    aria-label="Adicionar produto à banca"
  >
    <span class="merchant-add-product-icon" aria-hidden="true">+</span>
    <strong>Adicionar</strong>
  </button>

  <label class="merchant-products-search">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <circle cx="11" cy="11" r="7"></circle>
      <path d="m16 16 4 4"></path>
    </svg>
    <input
      type="search"
      data-my-offers-search
      placeholder="Buscar produtos, produtores, feiras..."
      aria-label="Buscar produtos da minha loja"
    />
  </label>

  <section class="merchant-products-list" aria-label="Seus produtos">
    <h2 class="merchant-products-visually-hidden">Seus produtos <span data-offer-count></span></h2>
    <div data-my-offers>
      <p class="merchant-products-message">Carregando seus produtos...</p>
    </div>
  </section>
</main>
